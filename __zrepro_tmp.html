<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
  body { margin:0; min-height:100dvh; font-family:system-ui; }
  .app-main { position:relative; z-index:10; padding:20px; padding-bottom:200px; }
  .tabbar { position:fixed; inset-inline:0; bottom:0; z-index:30; height:68px;
            background:rgba(20,20,40,.85); backdrop-filter:blur(20px); color:#fff;
            display:flex; align-items:center; justify-content:center; }
  .overlay { position:fixed; inset:0; z-index:40; background:rgba(255,0,0,.35); }
  .panel   { position:fixed; inset-inline:0; bottom:0; z-index:50; height:300px;
             background:#0b1020; color:#fff; border-top:3px solid lime; padding:12px; }
  .filler { height:1500px; background:linear-gradient(#333,#999); }
</style>
<main class="app-main">
  <p id="out"></p>
  <div class="filler"></div>
  <!-- Sheet rendered INSIDE .app-main, exactly like AdhanPicker -->
  <div class="overlay" id="ov"></div>
  <div class="panel" id="pa">SHEET PANEL (z-50, inside .app-main z-10)</div>
</main>
<nav class="tabbar" id="tb">TAB BAR (z-30, root)</nav>
<script>
  // Probe the bottom-centre point where the tab bar sits.
  const x = Math.round(innerWidth/2), y = Math.round(innerHeight - 30);
  const hit = document.elementFromPoint(x, y);
  // Probe a point inside the panel but above the tab bar.
  const hit2 = document.elementFromPoint(x, Math.round(innerHeight - 120));
  document.getElementById('out').textContent =
    'hit@bottom(' + x + ',' + y + ') = ' + (hit && hit.id) +
    ' | hit@panel = ' + (hit2 && hit2.id);
</script>
